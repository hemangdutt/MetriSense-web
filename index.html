    <script>
      (function() {
        function isBrowserLockerError(err) {
          var msg = (err && (err.message || err.reason || err)) || '';
          if (typeof msg !== 'string' && err && err.error && err.error.message) {
            msg = err.error.message;
          }
          return typeof msg === 'string' && msg.indexOf('Breaking Browser Locker Behavior') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isBrowserLockerError(e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isBrowserLockerError(e && e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        var prevOnError = window.onerror;
        window.onerror = function(msg, source, lineno, colno, error) {
          if (typeof msg === 'string' && msg.indexOf('Breaking Browser Locker Behavior') !== -1) {
            return true;
          }
          if (prevOnError) {
            return prevOnError.apply(this, arguments);
          }
        };
      })();
    </script>
